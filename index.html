
<!DOCTYPE html>
<html>
<head>
    <title>College Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="loginPage">
        <h1>College Portal</h1>
        <p>Login to your account</p>

        <form id="loginForm">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter email" required>

            <label>Password</label>
            <input type="password" id="password" placeholder="Enter password" required>

            <label>Select Role</label>
            <select id="role">
                <option value="student">Student</option>
                <option value="admin">Admin</option>
            </select>

            <button type="submit">Login</button>
            <p id="message"></p>
        </form>

        <p class="hint">
            Admin: admin@college.com / admin123<br>
            Student: student@college.com / stu123
        </p>
    </div>

    <div class="container dashboard" id="adminDashboard">
        <h1>Admin Dashboard</h1>
        <h3>Welcome, Admin!</h3>
        <p>You can manage college information.</p>
        <button onclick="logout()">Logout</button>
    </div>

    <div class="container dashboard" id="studentDashboard">
        <h1>Student Dashboard</h1>
        <h3>Welcome, Student!</h3>
        <p>You can view your college information.</p>
        <button onclick="logout()">Logout</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
